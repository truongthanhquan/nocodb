# This is a reusable workflow that builds and pushes a Docker image to GitHub Packages.
#
# It can be triggered in two ways:
# 1. Manually via `workflow_dispatch` with specified inputs.
# 2. Called by other workflows via `workflow_call`.

name: "Release: Timely Docker Github"

on:
  # Triggered manually
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        default: latest
      targetEnv:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - DEV
          - PROD
      isDaily:
        description: "Is a daily build"
        required: false
        type: choice
        options:
          - 'Y'
          - 'N'

  # Can be called by other workflows (e.g., pull-request-build.yml)
  workflow_call:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        type: string
      targetEnv:
        description: "Target Environment"
        required: true
        type: string
      isDaily:
        description: "Is it triggered by daily schedule"
        required: false
        type: string
      currentVersion:
        description: "The current NocoDB version"
        required: false
        type: string
    # GITHUB_TOKEN is automatically available and does not need to be passed as a secret.

jobs:
  buildx:
    runs-on: ubuntu-22.04
    env:
      working-directory: ./packages/nocodb
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get Docker Repository
        id: get-docker-repository
        run: |
          DOCKER_REPOSITORY=nocodb-daily
          DOCKER_BUILD_TAG=${{ github.event.inputs.tag || inputs.tag }}
          DOCKER_BUILD_LATEST_TAG=latest

          if [[ "$DOCKER_BUILD_TAG" =~ "-beta." ]]; then
            DOCKER_BUILD_LATEST_TAG=$(echo $DOCKER_BUILD_TAG | awk -F '-beta.' '{print $1}')-beta.latest
          fi

          if [[ "${{ github.event.inputs.targetEnv || inputs.targetEnv }}" == 'DEV' ]]; then
            if [[ "${{ github.event.inputs.currentVersion || inputs.currentVersion || 'N/A' }}" != 'N/A' ]]; then
              DOCKER_BUILD_TAG=${{ github.event.inputs.currentVersion || inputs.currentVersion }}-${{ github.event.inputs.tag || inputs.tag }}
            fi
            if [[ "${{ github.event.inputs.isDaily || inputs.isDaily || 'N' }}" == 'Y' ]]; then
              DOCKER_REPOSITORY=nocodb-daily
            else
              DOCKER_REPOSITORY=nocodb-timely
            fi
          fi

          echo "DOCKER_REPOSITORY=${DOCKER_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "DOCKER_BUILD_TAG=${DOCKER_BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "DOCKER_BUILD_LATEST_TAG=${DOCKER_BUILD_LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "DOCKER_REPOSITORY: ${DOCKER_REPOSITORY}"
          echo "DOCKER_BUILD_TAG: ${DOCKER_BUILD_TAG}"
          echo "DOCKER_BUILD_LATEST_TAG: ${DOCKER_BUILD_LATEST_TAG}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: pnpm bootstrap

      - name: Build gui and sdk
        run: |
          pnpm bootstrap && \
          cd packages/nc-gui && \
          pnpm run generate

          # copy build to nocodb
          rsync -rvzh ./dist/ ../nocodb/docker/nc-gui/

      - name: Build nocodb
        run: |
          # build nocodb ( pack nocodb-sdk and nc-gui )
          cd packages/nocodb && \
          EE=true pnpm exec rspack --config rspack.timely.config.js && \
          # remove bundled libraries (nocodb-sdk, knex-snowflake)
          pnpm uninstall --save-prod nocodb-sdk

      - name: Update version in package.json
        run: |
          # update package.json
          cd packages/nocodb && \
          jq --arg VERSION "$VERSION" '.version = $VERSION' package.json > tmp.json && \
          mv tmp.json package.json
        env:
          VERSION: ${{ steps.get-docker-repository.outputs.DOCKER_BUILD_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to Github Packages
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.working-directory }}
          file: ${{ env.working-directory }}/Dockerfile.timely
          build-args: NC_VERSION=${{ steps.get-docker-repository.outputs.DOCKER_BUILD_TAG }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          push: true
          labels: |
            "service=nocodb"
          tags: |
            ghcr.io/${{ github.repository_owner }}/nocodb:${{ steps.get-docker-repository.outputs.DOCKER_BUILD_TAG }}
            ghcr.io/${{ github.repository_owner }}/nocodb:${{ steps.get-docker-repository.outputs.DOCKER_BUILD_LATEST_TAG }}

      # Temp fix for cache issue with build-push-action
      # See: https://github.com/docker/build-push-action/issues/252
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

