# .github/workflows/sync-from-upstream.yml

name: Sync Fork from Upstream (Create PR)

# This action is manually triggerable from the Actions tab in your GitHub repository.
on:
  workflow_dispatch:
    inputs:
      # upstream_repo_owner and upstream_repo_name are now hardcoded below
      upstream_branch:
        description: "Branch in the upstream repository (nocodb/nocodb) to sync changes from (e.g., main, master, develop)"
        required: true
        default: "master" # Default changed to master
      fork_target_branch:
        description: "Target branch in this fork to merge upstream changes into (e.g., main, master, develop)"
        required: true
        default: "master" # Default changed to master
      pr_title:
        description: "Title for the Pull Request"
        required: true
        default: "Sync changes from upstream nocodb/nocodb"
      pr_body:
        description: "Body content for the Pull Request (optional)"
        required: false
        default: "This PR syncs changes from the upstream repository (nocodb/nocodb) to keep this fork up-to-date."

# Define permissions required by the job.
# GITHUB_TOKEN needs to read contents (for checkout) and write pull-requests.
permissions:
  contents: read
  pull-requests: write

jobs:
  create_pr_to_fork_from_upstream:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the forked repository
      # This checks out the specific branch in your fork that you intend to update (the base of the PR).
      - name: Checkout Forked Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.fork_target_branch }}
          # fetch-depth: 0 # Uncomment if you need the full history for some reason

      # Step 2: Create Pull Request using GitHub CLI
      # This step uses the gh CLI to create a pull request in your current (forked) repository.
      # The PR will propose merging changes from the specified upstream branch into your fork's target branch.
      - name: Create Pull Request to Fork from Upstream
        env:
          # GITHUB_TOKEN is automatically provided by GitHub Actions
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upstream repository owner and name are now hardcoded
          UPSTREAM_REPO_OWNER: "nocodb"
          UPSTREAM_REPO_NAME: "nocodb"
          # Construct the full upstream repository name (owner/repo)
          UPSTREAM_FULL_REPO: "nocodb/nocodb" # Hardcoded
          # The branch in the upstream repository that is the source of changes
          UPSTREAM_SOURCE_BRANCH: ${{ github.event.inputs.upstream_branch }}
          # The head of the PR, in "owner:branch" format, pointing to the upstream
          PR_HEAD_REF: "nocodb:${{ github.event.inputs.upstream_branch }}" # Hardcoded owner
          # The repository where the PR will be created (your current forked repository)
          FORK_REPO_FULL_NAME: ${{ github.repository }}
          # The base branch in your fork where changes will be merged
          FORK_TARGET_BRANCH: ${{ github.event.inputs.fork_target_branch }}
          # PR Title and Body from workflow inputs
          PR_TITLE: ${{ github.event.inputs.pr_title }}
          PR_BODY: ${{ github.event.inputs.pr_body }}
        run: |
          echo "Attempting to create a Pull Request in fork: ${FORK_REPO_FULL_NAME}"
          echo "  from Upstream Repository Branch: ${UPSTREAM_FULL_REPO}:${UPSTREAM_SOURCE_BRANCH} (Head: ${PR_HEAD_REF})" # UPSTREAM_FULL_REPO is now hardcoded
          echo "  to Fork Branch (Base): ${FORK_TARGET_BRANCH}"
          echo "  PR Title: \"${PR_TITLE}\""

          # Ensure gh CLI is available (it's pre-installed on GitHub-hosted runners)
          if ! command -v gh &> /dev/null
          then
              echo "Error: GitHub CLI (gh) not found. Please ensure it's available on the runner."
              exit 1
          fi
          echo "GitHub CLI version: $(gh --version)"

          # Create the pull request using gh pr create
          # --repo: The repository where the PR will be created (your fork).
          # --base: The target branch in your fork.
          # --head: The source of changes (the upstream branch, specified as owner:branch).
          # --title: The title of the PR.
          # --body: The body of the PR.
          gh pr create \
            --repo "${FORK_REPO_FULL_NAME}" \
            --base "${FORK_TARGET_BRANCH}" \
            --head "${PR_HEAD_REF}" \
            --title "${PR_TITLE}" \
            --body "${PR_BODY}" \
            && echo "Pull request created successfully in the fork!" \
            || echo "Failed to create pull request. This could be because a PR for these changes already exists, there are no new commits to sync, or due to permission/reference issues."
