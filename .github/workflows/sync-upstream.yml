name: Sync Fork with Upstream and Create PR

on:
  schedule:
    # Runs daily at 00:00 UTC. You can adjust as needed.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering
    inputs:
      upstream_repo_url:
        description: 'Full URL of the upstream repository (e.g., https://github.com/nocodb/nocodb.git)'
        required: true
        default: 'https://github.com/nocodb/nocodb.git'
      upstream_branch_name:
        description: 'Upstream branch to sync from (e.g., master, main, develop)'
        required: true
        default: 'master' # Ensure this default matches a common branch name in upstreams you target
      target_branch_in_fork:
        description: 'Target branch in your fork to create the PR against (e.g., master, main)'
        required: true
        default: 'master' # Ensure this default matches your typical target branch

jobs:
  sync_and_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Needed for checkout, git operations (pushing branches), and gh label create
      pull-requests: write # Needed for gh pr create

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history, useful for git operations
          # token: ${{ secrets.PAT_TOKEN }} # Optional: Use a PAT if GITHUB_TOKEN has insufficient permissions for cross-repo (though for same-repo fork, GITHUB_TOKEN usually suffices)

      - name: Set up Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Define Workflow Variables
        id: define_vars
        run: |
          # For workflow_dispatch, use inputs. For scheduled, use defaults from input block.
          # The '||' operator works as github.event.inputs.xyz will be null/empty for scheduled runs.
          CURRENT_UPSTREAM_REPO_URL="${{ github.event.inputs.upstream_repo_url || 'https://github.com/nocodb/nocodb.git' }}"
          echo "UPSTREAM_REPO_URL=$CURRENT_UPSTREAM_REPO_URL" >> $GITHUB_ENV

          CURRENT_UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch_name || 'master' }}"
          echo "UPSTREAM_BRANCH_NAME=$CURRENT_UPSTREAM_BRANCH" >> $GITHUB_ENV

          CURRENT_TARGET_BRANCH="${{ github.event.inputs.target_branch_in_fork || 'master' }}"
          echo "TARGET_BRANCH_IN_FORK=$CURRENT_TARGET_BRANCH" >> $GITHUB_ENV

          # Extract owner/repo from URL for PR messages, etc.
          # Uses bash regex. Ensure it's robust for your expected URL formats.
          if [[ "$CURRENT_UPSTREAM_REPO_URL" =~ github\.com/([^/]+/[^/]+?)(\.git)?$ ]]; then
            UPSTREAM_OWNER_REPO_VAL="${BASH_REMATCH[1]}"
          else
            echo "::warning::Could not parse UPSTREAM_OWNER_REPO from $CURRENT_UPSTREAM_REPO_URL. Using full URL as fallback."
            UPSTREAM_OWNER_REPO_VAL="$CURRENT_UPSTREAM_REPO_URL"
          fi
          echo "UPSTREAM_OWNER_REPO=$UPSTREAM_OWNER_REPO_VAL" >> $GITHUB_ENV
          echo "Defined UPSTREAM_REPO_URL: $CURRENT_UPSTREAM_REPO_URL"
          echo "Defined UPSTREAM_BRANCH_NAME: $CURRENT_UPSTREAM_BRANCH"
          echo "Defined TARGET_BRANCH_IN_FORK: $CURRENT_TARGET_BRANCH"
          echo "Parsed UPSTREAM_OWNER_REPO: $UPSTREAM_OWNER_REPO_VAL"

      - name: Add Upstream Remote and Fetch Latest Changes
        id: fetch_upstream
        run: |
          echo "Adding remote upstream: ${{ env.UPSTREAM_REPO_URL }}"
          git remote add upstream "${{ env.UPSTREAM_REPO_URL }}" || echo "Upstream remote 'upstream' already exists or failed to add (proceeding)."
          
          echo "Fetching from upstream branch: ${{ env.UPSTREAM_BRANCH_NAME }}"
          # Fetch specific branch to avoid fetching unnecessary data. Fetch tags as well.
          git fetch upstream "${{ env.UPSTREAM_BRANCH_NAME }}" --tags --prune --force 
          
          # Get the SHA of the fetched upstream branch head
          UPSTREAM_LATEST_SHA=$(git rev-parse "upstream/${{ env.UPSTREAM_BRANCH_NAME }}")
          if [ -z "$UPSTREAM_LATEST_SHA" ]; then
            echo "::error::Could not get SHA for upstream/${{ env.UPSTREAM_BRANCH_NAME }}. Ensure the branch exists in the upstream repository."
            exit 1
          fi
          echo "UPSTREAM_COMMIT_SHA=$UPSTREAM_LATEST_SHA" >> $GITHUB_ENV
          echo "Fetched upstream branch ${{ env.UPSTREAM_BRANCH_NAME }} at SHA: $UPSTREAM_LATEST_SHA"

      - name: Create New Sync Branch from Upstream Commit and Push to Fork
        id: create_and_push_new_branch
        run: |
          # Generate a unique branch name for the sync to avoid collisions
          # Using date and short SHA for uniqueness and traceability
          SHORT_SHA=$(echo "${{ env.UPSTREAM_COMMIT_SHA }}" | cut -c1-7)
          NEW_SYNC_BRANCH_NAME="sync/${{ env.UPSTREAM_BRANCH_NAME }}-from-${SHORT_SHA}-$(date +%Y%m%d-%H%M%S)"
          echo "NEW_BRANCH_NAME_ENV=$NEW_SYNC_BRANCH_NAME" >> $GITHUB_ENV
          echo "Preparing new branch: $NEW_SYNC_BRANCH_NAME from upstream commit ${{ env.UPSTREAM_COMMIT_SHA }}"

          # Check if a branch with the same name already exists locally (e.g., from a failed previous run)
          if git rev-parse --verify "$NEW_SYNC_BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch $NEW_SYNC_BRANCH_NAME already exists locally. Deleting and recreating."
            git branch -D "$NEW_SYNC_BRANCH_NAME"
          fi

          # Create the new branch pointing to the fetched upstream commit SHA
          git checkout -b "$NEW_SYNC_BRANCH_NAME" "${{ env.UPSTREAM_COMMIT_SHA }}"
          echo "Successfully created local branch $NEW_SYNC_BRANCH_NAME."

          # Push the new branch to the fork (origin)
          echo "Pushing new branch $NEW_SYNC_BRANCH_NAME to origin (fork)..."
          # Use --force if the branch might somehow exist on the remote from a previous failed/rerun attempt.
          # For truly unique branch names, --force might not be strictly necessary but adds robustness.
          git push origin "$NEW_SYNC_BRANCH_NAME" --force 
          echo "Successfully pushed $NEW_SYNC_BRANCH_NAME to origin."

      - name: Ensure Labels Exist in Fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABELS_TO_ENSURE=("upstream-sync" "automated-pr")
          DESCRIPTIONS=("Pull request to sync with upstream repository" "Pull request generated automatically by GitHub Actions")
          COLORS=("1D76DB" "0E8A16")

          for i in ${!LABELS_TO_ENSURE[@]}; do
            LABEL_NAME="${LABELS_TO_ENSURE[i]}"
            LABEL_DESC="${DESCRIPTIONS[i]}"
            LABEL_COLOR="${COLORS[i]}"
            echo "Ensuring label '$LABEL_NAME' exists..."
            gh label create "$LABEL_NAME" \
              --repo "${{ github.repository }}" \
              --description "$LABEL_DESC" \
              --color "$LABEL_COLOR" \
              || echo "Label '$LABEL_NAME' already exists or failed to create (non-critical, will proceed)."
          done

      - name: Create Pull Request using GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          # All other env vars (UPSTREAM_BRANCH_NAME, UPSTREAM_OWNER_REPO, TARGET_BRANCH_IN_FORK,
          # UPSTREAM_COMMIT_SHA, NEW_BRANCH_NAME_ENV) are sourced from $GITHUB_ENV
          # set by previous steps.
        run: |
          set -x # Enable xtrace for detailed command logging

          echo "GitHub CLI Version:"
          gh --version
          echo "GitHub Auth Status:"
          gh auth status || echo "::warning::Failed to get gh auth status."

          # Construct PR title and body
          PR_TITLE="Sync fork: ${{ env.UPSTREAM_BRANCH_NAME }} from ${{ env.UPSTREAM_OWNER_REPO }} into branch ${{ env.NEW_BRANCH_NAME_ENV }}"
          
          PR_BODY=$(cat <<EOF
          This PR was automatically created by a GitHub Action to sync this fork with the upstream repository.

          **Target in this Fork (Base):** \`${{ env.TARGET_BRANCH_IN_FORK }}\`
          **New branch in this Fork (Head):** \`${{ env.NEW_BRANCH_NAME_ENV }}\`
          
          **Source of changes (Upstream):**
          - Repository: \`${{ env.UPSTREAM_OWNER_REPO }}\`
          - Branch: \`${{ env.UPSTREAM_BRANCH_NAME }}\`
          - Commit SHA: \`${{ env.UPSTREAM_COMMIT_SHA }}\`

          Please review the changes and merge if appropriate.
          This PR attempts to bring the latest changes from the specified upstream repository and branch.
          EOF
          )

          echo "Attempting to create PR with Title: '${PR_TITLE}'"
          echo "Base branch: ${{ env.TARGET_BRANCH_IN_FORK }}"
          echo "Head branch: ${{ env.NEW_BRANCH_NAME_ENV }} (on repository: ${{ github.repository }})"
          echo "Head branch full ref for PR: ${{ github.repository_owner }}:${{ env.NEW_BRANCH_NAME_ENV }}"


          # Ensure the local reference to the target branch on origin is up-to-date for accurate comparison
          echo "Fetching target branch '${{ env.TARGET_BRANCH_IN_FORK }}' from origin to ensure it's up-to-date for comparison."
          git fetch origin "${{ env.TARGET_BRANCH_IN_FORK }}":refs/remotes/origin/"${{ env.TARGET_BRANCH_IN_FORK }}" --force || \
            echo "::warning::Failed to fetch target branch ${{ env.TARGET_BRANCH_IN_FORK }} from origin. It might not exist or there was a network issue. Comparison might be inaccurate."
          
          # Log actual commits that would be part of the PR
          echo "Commits to be included in PR from '${{ env.NEW_BRANCH_NAME_ENV }}' against 'origin/${{ env.TARGET_BRANCH_IN_FORK }}':"
          git log --oneline --graph "origin/${{ env.TARGET_BRANCH_IN_FORK }}".."${{ env.NEW_BRANCH_NAME_ENV }}" || echo "::warning::Could not list commits between branches."


          # Check if the upstream commit (which is what our new branch is based on) introduces new changes
          # compared to the target branch in our fork.
          echo "Checking if upstream commit ${{ env.UPSTREAM_COMMIT_SHA }} introduces new changes compared to origin/${{ env.TARGET_BRANCH_IN_FORK }}..."
          # `git rev-list --count A..B` counts commits in B not in A.
          # We expect new commits in NEW_BRANCH_NAME_ENV (which is UPSTREAM_COMMIT_SHA) that are not in origin/TARGET_BRANCH_IN_FORK
          COMMIT_COUNT=$(git rev-list --count "origin/${{ env.TARGET_BRANCH_IN_FORK }}".."${{ env.NEW_BRANCH_NAME_ENV }}")
          echo "Number of new commits found: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No new commits detected between 'origin/${{ env.TARGET_BRANCH_IN_FORK }}' and '${{ env.NEW_BRANCH_NAME_ENV }}'."
            echo "Skipping PR creation."
            # Optionally, delete the pushed sync branch if no PR is created to keep the fork clean
            # echo "Deleting remote branch ${{ env.NEW_BRANCH_NAME_ENV }} as no PR will be created."
            # git push origin --delete "${{ env.NEW_BRANCH_NAME_ENV }}"
            exit 0 # Exit successfully as no action is needed
          else
            echo "New changes detected ($COMMIT_COUNT commits). Proceeding with PR creation."
          fi

          # Check if a PR already exists for this new branch to the target branch
          # The head branch includes the owner: `OWNER:BRANCH_NAME`
          HEAD_BRANCH_FOR_CHECK="${{ github.repository_owner }}:${{ env.NEW_BRANCH_NAME_ENV }}"
          
          EXISTING_PR_URL=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base "${{ env.TARGET_BRANCH_IN_FORK }}" \
            --head "$HEAD_BRANCH_FOR_CHECK" \
            --state open \
            --json url \
            --jq '.[0].url' 2>/dev/null) # Suppress stderr for jq if no PRs found

          if [ -n "$EXISTING_PR_URL" ] && [ "$EXISTING_PR_URL" != "null" ]; then
            echo "An open pull request from '${HEAD_BRANCH_FOR_CHECK}' to '${{ env.TARGET_BRANCH_IN_FORK }}' already exists: $EXISTING_PR_URL"
            echo "Skipping PR creation."
          else
            echo "No existing open PR found. Creating a new one."
            # Use explicit owner:branch for head to be absolutely clear
            # Add GH_DEBUG=api for verbose output from gh cli
            PR_CREATE_OUTPUT=$(GH_DEBUG=api gh pr create \
              --repo "${{ github.repository }}" \
              --base "${{ env.TARGET_BRANCH_IN_FORK }}" \
              --head "${{ github.repository_owner }}:${{ env.NEW_BRANCH_NAME_ENV }}" \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --label "upstream-sync,automated-pr" 2>&1) # Capture output for logging
            
            PR_CREATE_STATUS=$?
            echo "Output from 'gh pr create' (GH_DEBUG=api was enabled):"
            echo "$PR_CREATE_OUTPUT" # Log output from gh pr create

            if [ $PR_CREATE_STATUS -eq 0 ]; then
              echo "Pull request created successfully for branch '${{ env.NEW_BRANCH_NAME_ENV }}' into '${{ env.TARGET_BRANCH_IN_FORK }}'."
            else
              echo "::error::Failed to create pull request. 'gh pr create' exited with status: $PR_CREATE_STATUS"
              # Additional check: Does the head branch actually exist on the remote?
              # This check is somewhat redundant if the push step succeeded, but can be a diagnostic.
              if ! git ls-remote --exit-code --heads origin "${{ env.NEW_BRANCH_NAME_ENV }}"; then
                echo "::error::Verification failed: Head branch ${{ env.NEW_BRANCH_NAME_ENV }} does not exist on remote 'origin'."
              fi
              exit 1 # Fail the step
            fi
          fi
          set +x # Disable xtrace

      - name: Notify on Failure (Optional)
        if: failure()
        run: echo "::error::Workflow failed during the sync and PR creation process. Check the logs for the specific failing step and error messages."

