name: Sync Fork with Upstream (Clone Method) and Create PR

on:
  schedule:
    # Runs daily at 00:00 UTC. You can adjust the schedule as needed.
    # See https://crontab.guru/ for cron schedule expressions.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  sync_and_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # To push the new branch to the fork
      pull-requests: write # To create the pull request in the fork

    steps:
      - name: Checkout Forked Repository (for PR context)
        uses: actions/checkout@v4
        with:
          # Fetch depth 0 can be useful for peter-evans/create-pull-request
          # if it needs more history from the fork for its operations.
          fetch-depth: 0
          # Optional: If GITHUB_TOKEN's default permissions are restricted,
          # you might need a Personal Access Token (PAT) with 'repo' scope.
          # token: ${{ secrets.YOUR_PAT_WITH_REPO_SCOPE }}

      - name: Define Upstream Details
        id: upstream_details
        run: |
          echo "url=https://github.com/nocodb/nocodb.git" >> $GITHUB_OUTPUT
          echo "branch=master" >> $GITHUB_OUTPUT # Define the upstream branch to sync from

      - name: Sync from Upstream and Push Branch to Fork
        id: sync_branch_details
        env:
          # GITHUB_TOKEN is automatically available and used for authentication.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Construct the URL for your fork repository.
          FORK_REPO_SLUG: ${{ github.repository }} # e.g., your-username/your-fork-repo
          UPSTREAM_REPO_URL: ${{ steps.upstream_details.outputs.url }}
          UPSTREAM_BRANCH_NAME: ${{ steps.upstream_details.outputs.branch }}
        run: |
          set -e # Exit immediately if a command exits with a non-zero status.
          TEMP_UPSTREAM_DIR="upstream_clone_temp_dir" # Name for the temporary directory
          
          echo "Cloning upstream repository (${UPSTREAM_REPO_URL}) branch (${UPSTREAM_BRANCH_NAME}) into ${TEMP_UPSTREAM_DIR}..."
          # Clone only the target branch with minimal history (depth 1).
          git clone --depth 1 --branch "${UPSTREAM_BRANCH_NAME}" "${UPSTREAM_REPO_URL}" "${TEMP_UPSTREAM_DIR}"
          
          # Navigate into the temporary clone directory.
          cd "${TEMP_UPSTREAM_DIR}"
          
          echo "Setting up Git user in ${TEMP_UPSTREAM_DIR}..."
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id}}+${{ github.actor }}@users.noreply.github.com"
          
          # Get the commit SHA of the HEAD of the cloned upstream branch.
          UPSTREAM_COMMIT_SHA=$(git rev-parse HEAD)
          echo "Upstream commit SHA (from ${TEMP_UPSTREAM_DIR}/.git/HEAD): ${UPSTREAM_COMMIT_SHA}"
          # Make this SHA available to subsequent steps via environment variables for the PR body.
          echo "UPSTREAM_COMMIT_SHA_ENV=${UPSTREAM_COMMIT_SHA}" >> $GITHUB_ENV

          # Create a unique branch name for the sync, incorporating a timestamp.
          BRANCH_NAME="sync-upstream-$(date +%Y%m%d%H%M%S)"
          echo "Creating new branch '${BRANCH_NAME}' from upstream's ${UPSTREAM_BRANCH_NAME} (commit ${UPSTREAM_COMMIT_SHA})..."
          # Create the new branch from the current HEAD (which is the upstream branch's HEAD).
          git checkout -b "$BRANCH_NAME"
          
          # Verify that the new branch's HEAD matches the upstream commit SHA.
          NEW_BRANCH_HEAD_SHA=$(git rev-parse HEAD)
          if [ "${UPSTREAM_COMMIT_SHA}" != "${NEW_BRANCH_HEAD_SHA}" ]; then
            echo "::error:: Mismatch after creating branch in temp clone! New branch HEAD SHA (${NEW_BRANCH_HEAD_SHA}) does not match original upstream SHA (${UPSTREAM_COMMIT_SHA})."
            exit 1
          fi
          echo "Successfully created branch '${BRANCH_NAME}' in ${TEMP_UPSTREAM_DIR} based on upstream commit."

          echo "Adding fork repository (https://github.com/${FORK_REPO_SLUG}.git) as remote 'fork_remote'..."
          # Add the fork repository as a remote, authenticating with GITHUB_TOKEN.
          git remote add fork_remote "https://x-access-token:${GH_TOKEN}@github.com/${FORK_REPO_SLUG}.git"
          
          echo "Pushing branch '${BRANCH_NAME}' to fork repository (fork_remote)..."
          git push fork_remote "$BRANCH_NAME"
          echo "Pushed branch '${BRANCH_NAME}' to fork repository."
          
          # Output the new branch name for use in the pull request step.
          echo "branch_name_output=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          # Navigate out of the temporary directory before deleting it.
          cd ..
          echo "Cleaning up temporary directory ${TEMP_UPSTREAM_DIR}..."
          rm -rf "${TEMP_UPSTREAM_DIR}"
          echo "Temporary directory cleaned up successfully."

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          # If you used a PAT in the checkout step or if GITHUB_TOKEN has insufficient permissions
          # for create-pull-request action specifically, you might need to pass it here.
          # token: ${{ secrets.YOUR_PAT_WITH_REPO_SCOPE }}
          commit-message: "chore: Sync with upstream ${{ steps.upstream_details.outputs.branch }}"
          title: "Sync with upstream ${{ steps.upstream_details.outputs.branch }} (Branch: ${{ steps.sync_branch_details.outputs.branch_name_output }})"
          body: |
            This PR was automatically created by a GitHub Action to sync this fork with the latest changes from `${{ steps.upstream_details.outputs.url }}`, branch `${{ steps.upstream_details.outputs.branch }}`.

            **Upstream Commit Synced:** `${{ env.UPSTREAM_COMMIT_SHA_ENV }}`
            **Source Branch in Fork (Head of this PR):** `${{ steps.sync_branch_details.outputs.branch_name_output }}`

            Please review the changes and merge if appropriate.
          # The branch in your fork that contains the upstream changes (created in the previous step).
          branch: ${{ steps.sync_branch_details.outputs.branch_name_output }}
          # The branch in YOUR FORK that the changes should be merged INTO.
          # Typically 'master' or 'main'. Adjust if your fork's default/target branch is different.
          base: master 
          labels: |
            upstream-sync
            automated-pr
          draft: false # Set to true if you want draft PRs
          # Optional: Assignees and Reviewers
          # assignees: your-github-username
          # reviewers: your-github-username,another-reviewer

      - name: Notify on Failure (Optional)
        if: failure()
        run: echo "::error::Workflow failed to sync with upstream (clone method) and create PR."
