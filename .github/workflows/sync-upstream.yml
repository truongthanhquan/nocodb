name: Sync Fork with Upstream and Auto-Merge PR

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      upstream_repo_url:
        description: 'Full URL of the upstream repository (e.g., https://github.com/nocodb/nocodb.git)'
        required: true
        default: 'https://github.com/nocodb/nocodb.git'
      upstream_branch_name:
        description: 'Upstream branch to sync from (e.g., master, main, develop)'
        required: true
        default: 'master'
      target_branch_in_fork:
        description: 'Target branch in your fork to create the PR against (e.g., master, main)'
        required: true
        default: 'master'

jobs:
  sync_and_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Define Workflow Variables
        id: define_vars
        run: |
          CURRENT_UPSTREAM_REPO_URL="${{ github.event.inputs.upstream_repo_url || 'https://github.com/nocodb/nocodb.git' }}"
          echo "UPSTREAM_REPO_URL=$CURRENT_UPSTREAM_REPO_URL" >> $GITHUB_ENV
          CURRENT_UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch_name || 'master' }}"
          echo "UPSTREAM_BRANCH_NAME=$CURRENT_UPSTREAM_BRANCH" >> $GITHUB_ENV
          CURRENT_TARGET_BRANCH="${{ github.event.inputs.target_branch_in_fork || 'master' }}"
          echo "TARGET_BRANCH_IN_FORK=$CURRENT_TARGET_BRANCH" >> $GITHUB_ENV
          if [[ "$CURRENT_UPSTREAM_REPO_URL" =~ github\.com/([^/]+/[^/]+?)(\.git)?$ ]]; then
            UPSTREAM_OWNER_REPO_VAL="${BASH_REMATCH[1]}"
          else
            echo "::warning::Could not parse UPSTREAM_OWNER_REPO from $CURRENT_UPSTREAM_REPO_URL. Using full URL as fallback."
            UPSTREAM_OWNER_REPO_VAL="$CURRENT_UPSTREAM_REPO_URL"
          fi
          echo "UPSTREAM_OWNER_REPO=$UPSTREAM_OWNER_REPO_VAL" >> $GITHUB_ENV
          echo "Defined UPSTREAM_REPO_URL: $CURRENT_UPSTREAM_REPO_URL"
          echo "Defined UPSTREAM_BRANCH_NAME: $CURRENT_UPSTREAM_BRANCH"
          echo "Defined TARGET_BRANCH_IN_FORK: $CURRENT_TARGET_BRANCH"
          echo "Parsed UPSTREAM_OWNER_REPO: $UPSTREAM_OWNER_REPO_VAL"

      - name: Add Upstream Remote and Fetch Latest Changes
        id: fetch_upstream
        run: |
          echo "Adding remote upstream: ${{ env.UPSTREAM_REPO_URL }}"
          git remote add upstream "${{ env.UPSTREAM_REPO_URL }}" || echo "Upstream remote 'upstream' already exists or failed to add (proceeding)."
          echo "Fetching from upstream branch: ${{ env.UPSTREAM_BRANCH_NAME }}"
          git fetch upstream "${{ env.UPSTREAM_BRANCH_NAME }}" --tags --prune --force
          UPSTREAM_LATEST_SHA=$(git rev-parse "upstream/${{ env.UPSTREAM_BRANCH_NAME }}" 2>/dev/null)
          if [ -z "$UPSTREAM_LATEST_SHA" ]; then
            echo "::error::Could not get SHA for upstream/${{ env.UPSTREAM_BRANCH_NAME }}. Ensure the branch exists in the upstream repository."
            exit 1
          fi
          echo "UPSTREAM_COMMIT_SHA=$UPSTREAM_LATEST_SHA" >> $GITHUB_ENV
          SHORT_UPSTREAM_SHA=$(echo "$UPSTREAM_LATEST_SHA" | cut -c1-7)
          echo "SHORT_UPSTREAM_SHA=$SHORT_UPSTREAM_SHA" >> $GITHUB_ENV
          echo "Fetched upstream branch ${{ env.UPSTREAM_BRANCH_NAME }} at SHA: $UPSTREAM_LATEST_SHA (Short: $SHORT_UPSTREAM_SHA)"

      - name: Check if Sync is Needed
        id: check_sync_status
        run: |
          UPSTREAM_LATEST_SHA_ENV="${{ env.UPSTREAM_COMMIT_SHA }}"
          TARGET_BRANCH_NAME_ENV="${{ env.TARGET_BRANCH_IN_FORK }}"
          UPSTREAM_BRANCH_NAME_ENV="${{ env.UPSTREAM_BRANCH_NAME }}"
          echo "Checking sync status..."
          echo "Upstream commit SHA ($UPSTREAM_BRANCH_NAME_ENV): $UPSTREAM_LATEST_SHA_ENV"
          echo "Target branch in fork: $TARGET_BRANCH_NAME_ENV"
          
          # Fetch all branches from origin to ensure we have the latest state
          git fetch origin --no-tags --quiet
          
          if ! git rev-parse --verify "refs/remotes/origin/$TARGET_BRANCH_NAME_ENV" >/dev/null 2>&1; then
            echo "Target branch 'origin/$TARGET_BRANCH_NAME_ENV' not found in fork. Sync is needed."
            echo "SYNC_NEEDED=true" >> $GITHUB_ENV
            echo "TARGET_BRANCH_CURRENT_SHA=" >> $GITHUB_ENV
            exit 0
          fi
          
          TARGET_BRANCH_CURRENT_SHA=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH_NAME_ENV")
          echo "Target branch SHA: $TARGET_BRANCH_CURRENT_SHA"
          
          if [ "$UPSTREAM_LATEST_SHA_ENV" = "$TARGET_BRANCH_CURRENT_SHA" ]; then
            echo "Target branch '$TARGET_BRANCH_NAME_ENV' (SHA: $TARGET_BRANCH_CURRENT_SHA) is identical to upstream branch '$UPSTREAM_BRANCH_NAME_ENV' (SHA: $UPSTREAM_LATEST_SHA_ENV)."
            echo "No sync required."
            echo "SYNC_NEEDED=false" >> $GITHUB_ENV
          elif git merge-base --is-ancestor "$UPSTREAM_LATEST_SHA_ENV" "$TARGET_BRANCH_CURRENT_SHA"; then
            echo "Target branch '$TARGET_BRANCH_NAME_ENV' (SHA: $TARGET_BRANCH_CURRENT_SHA) is ahead of or up-to-date with upstream branch '$UPSTREAM_BRANCH_NAME_ENV' (SHA: $UPSTREAM_LATEST_SHA_ENV)."
            echo "No sync required."
            echo "SYNC_NEEDED=false" >> $GITHUB_ENV
          else
            echo "Target branch '$TARGET_BRANCH_NAME_ENV' (SHA: $TARGET_BRANCH_CURRENT_SHA) is behind upstream branch '$UPSTREAM_BRANCH_NAME_ENV' (SHA: $UPSTREAM_LATEST_SHA_ENV)."
            echo "Sync is needed."
            echo "SYNC_NEEDED=true" >> $GITHUB_ENV
          fi
          echo "SYNC_NEEDED is set to: ${SYNC_NEEDED}"

      - name: Create New Sync Branch from Upstream Commit and Push to Fork
        if: env.SYNC_NEEDED == 'true'
        id: create_and_push_new_branch
        run: |
          SHORT_SHA_ENV="${{ env.SHORT_UPSTREAM_SHA }}"
          NEW_SYNC_BRANCH_NAME="sync/${{ env.UPSTREAM_BRANCH_NAME }}-from-${SHORT_SHA_ENV}-$(date +%Y%m%d-%H%M%S)"
          echo "NEW_BRANCH_NAME_ENV=$NEW_SYNC_BRANCH_NAME" >> $GITHUB_ENV
          echo "Preparing new branch: $NEW_SYNC_BRANCH_NAME from upstream commit ${{ env.UPSTREAM_COMMIT_SHA }}"
          
          if git rev-parse --verify "$NEW_SYNC_BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch $NEW_SYNC_BRANCH_NAME already exists locally. Deleting and recreating."
            git branch -D "$NEW_SYNC_BRANCH_NAME"
          fi
          
          git checkout -b "$NEW_SYNC_BRANCH_NAME" "${{ env.UPSTREAM_COMMIT_SHA }}"
          echo "Successfully created local branch $NEW_SYNC_BRANCH_NAME."
          
          # Fetch target branch locally for accurate diff
          if [ -n "${{ env.TARGET_BRANCH_CURRENT_SHA }}" ]; then
            git fetch origin "${{ env.TARGET_BRANCH_IN_FORK }}" --no-tags --quiet
            git checkout "${{ env.TARGET_BRANCH_IN_FORK }}" --quiet
            git checkout "$NEW_SYNC_BRANCH_NAME" --quiet
            if git diff --quiet "${{ env.TARGET_BRANCH_IN_FORK }}" "$NEW_SYNC_BRANCH_NAME"; then
              echo "No differences between $NEW_SYNC_BRANCH_NAME and ${{ env.TARGET_BRANCH_IN_FORK }}. Skipping push and PR creation."
              echo "SYNC_NEEDED=false" >> $GITHUB_ENV
              exit 0
            fi
          fi
          
          echo "Pushing new branch $NEW_SYNC_BRANCH_NAME to origin (fork)..."
          if ! git push origin "$NEW_SYNC_BRANCH_NAME" --force 2>&1 | tee push_output.log; then
            echo "::error::Failed to push branch $NEW_SYNC_BRANCH_NAME to origin. Check permissions or branch protection rules."
            cat push_output.log
            exit 1
          fi
          echo "Successfully pushed $NEW_SYNC_BRANCH_NAME to origin."

      - name: Ensure Labels Exist in Fork
        if: env.SYNC_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          LABELS_TO_ENSURE=("upstream-sync" "automated-pr")
          DESCRIPTIONS=("Pull request to sync with upstream repository" "Pull request generated automatically by GitHub Actions")
          COLORS=("1D76DB" "0E8A16")
          for i in ${!LABELS_TO_ENSURE[@]}; do
            LABEL_NAME="${LABELS_TO_ENSURE[i]}"
            LABEL_DESC="${DESCRIPTIONS[i]}"
            LABEL_COLOR="${COLORS[i]}"
            echo "Ensuring label '$LABEL_NAME' exists..."
            if ! gh label list --repo "${{ github.repository }}" --search "$LABEL_NAME" | grep -q "$LABEL_NAME"; then
              echo "Creating label '$LABEL_NAME'..."
              if gh label create "$LABEL_NAME" \
                --repo "${{ github.repository }}" \
                --description "$LABEL_DESC" \
                --color "$LABEL_COLOR" 2>&1 | tee label_creation.log; then
                echo "Successfully created label '$LABEL_NAME'."
              else
                echo "::error::Failed to create label '$LABEL_NAME'. Check permissions or GitHub API status."
                cat label_creation.log
                exit 1
              fi
            else
              echo "Label '$LABEL_NAME' already exists."
            fi
          done
          # Wait briefly to ensure labels are available
          sleep 2

      - name: Create Pull Request
        if: env.SYNC_NEEDED == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Creating pull request..."
          # Log SHAs for debugging
          echo "Head branch: ${{ env.NEW_BRANCH_NAME_ENV }}"
          echo "Base branch: ${{ env.TARGET_BRANCH_IN_FORK }}"
          HEAD_SHA=$(git rev-parse "origin/${{ env.NEW_BRANCH_NAME_ENV }}" 2>/dev/null || echo "")
          BASE_SHA=$(git rev-parse "origin/${{ env.TARGET_BRANCH_IN_FORK }}" 2>/dev/null || echo "")
          echo "Head SHA: $HEAD_SHA"
          echo "Base SHA: $BASE_SHA"
          
          # Create PR and capture the PR number
          PR_OUTPUT=$(gh pr create \
            --title "Sync: ${{ env.UPSTREAM_OWNER_REPO }}/${{ env.UPSTREAM_BRANCH_NAME }} (${{ env.SHORT_UPSTREAM_SHA }}) to ${{ env.TARGET_BRANCH_IN_FORK }}" \
            --body "This PR was automatically created by a GitHub Action to sync this fork with the upstream repository.

          **Upstream Details:**
          - Repository: \`${{ env.UPSTREAM_OWNER_REPO }}\` (\`${{ env.UPSTREAM_REPO_URL }}\`)
          - Branch: \`${{ env.UPSTREAM_BRANCH_NAME }}\`
          - Commit SHA: \`${{ env.UPSTREAM_COMMIT_SHA }}\` (Short: \`${{ env.SHORT_UPSTREAM_SHA }}\`)

          **Fork Details:**
          - Target Branch (Base): \`${{ env.TARGET_BRANCH_IN_FORK }}\`
          - New Sync Branch (Head): \`${{ env.NEW_BRANCH_NAME_ENV }}\`

          This PR will be auto-merged if it passes all checks and has no conflicts." \
            --head "${{ env.NEW_BRANCH_NAME_ENV }}" \
            --base "${{ env.TARGET_BRANCH_IN_FORK }}" \
            --repo "${{ github.repository }}" \
            --label "upstream-sync,automated-pr" 2>&1)
          
          if [ $? -ne 0 ]; then
            echo "::error::Failed to create pull request. Check logs for details."
            echo "$PR_OUTPUT"
            exit 1
          fi
          
          PR_URL="$PR_OUTPUT"
          echo "Pull request created: $PR_URL"
          
          # Extract PR number from URL (e.g., https://github.com/owner/repo/pull/123 -> 123)
          if [[ "$PR_URL" =~ /pull/([0-9]+)$ ]]; then
            PR_NUMBER="${BASH_REMATCH[1]}"
            echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          else
            echo "::error::Failed to parse PR number from URL: $PR_URL"
            exit 1
          fi

      - name: Auto-Merge Pull Request
        if: env.SYNC_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR_NUMBER="${{ env.PR_NUMBER }}"
          echo "Attempting to auto-merge PR #$PR_NUMBER..."
          
          # Check if PR is mergeable
          PR_STATE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json mergeable,mergeableState | jq -r '.mergeableState')
          echo "PR mergeable state: $PR_STATE"
          
          if [ "$PR_STATE" = "MERGEABLE" ]; then
            echo "PR #$PR_NUMBER is mergeable. Proceeding with auto-merge..."
            if gh pr merge "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --merge \
              --delete-branch 2>&1 | tee merge_output.log; then
              echo "Successfully merged PR #$PR_NUMBER and deleted branch ${{ env.NEW_BRANCH_NAME_ENV }}."
            else
              echo "::error::Failed to merge PR #$PR_NUMBER. Check permissions, branch protection rules, or merge conflicts."
              cat merge_output.log
              exit 1
            fi
          else
            echo "::warning::PR #$PR_NUMBER is not in a mergeable state (state: $PR_STATE). Skipping auto-merge."
            echo "Please review the PR manually: https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
          fi

      - name: Notify on Failure
        if: failure() && (env.SYNC_NEEDED == 'true')
        run: echo "::error::Workflow failed during the sync and PR creation process. Check the logs for specific error messages."

      - name: Sync Skipped Notification
        if: success() && env.SYNC_NEEDED == 'false'
        run: |
          echo "Sync skipped: Target branch '${{ env.TARGET_BRANCH_IN_FORK }}' is already up-to-date with upstream '${{ env.UPSTREAM_BRANCH_NAME }}'."
