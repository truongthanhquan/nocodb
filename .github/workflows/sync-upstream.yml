name: Sync Fork and Create PR

on:
  workflow_dispatch:
    inputs:
      upstream_repo_url:
        description: 'Upstream repository URL'
        required: false
        default: 'https://github.com/nocodb/nocodb.git'
      upstream_branch_name:
        description: 'Branch name in upstream repository'
        required: false
        default: 'main'
      target_branch_in_fork:
        description: 'Branch name in your fork to sync'
        required: false
        default: 'main'

  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00 UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO_URL_DEFAULT: 'https://github.com/nocodb/nocodb.git'
      UPSTREAM_BRANCH_DEFAULT: 'main'
      TARGET_BRANCH_DEFAULT: 'main'

    steps:
      - name: Checkout your forked repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch_in_fork || env.TARGET_BRANCH_DEFAULT }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Define Workflow Variables
        id: define_vars
        run: |
          CURRENT_UPSTREAM_REPO_URL="${{ github.event.inputs.upstream_repo_url }}"
          if [ -z "$CURRENT_UPSTREAM_REPO_URL" ]; then
            CURRENT_UPSTREAM_REPO_URL="${{ env.UPSTREAM_REPO_URL_DEFAULT }}"
          fi
          echo "UPSTREAM_REPO_URL=$CURRENT_UPSTREAM_REPO_URL" >> $GITHUB_ENV

          CURRENT_UPSTREAM_BRANCH="${{ github.event.inputs.upstream_branch_name }}"
          if [ -z "$CURRENT_UPSTREAM_BRANCH" ]; then
            CURRENT_UPSTREAM_BRANCH="${{ env.UPSTREAM_BRANCH_DEFAULT }}"
          fi
          echo "UPSTREAM_BRANCH_NAME=$CURRENT_UPSTREAM_BRANCH" >> $GITHUB_ENV

          CURRENT_TARGET_BRANCH="${{ github.event.inputs.target_branch_in_fork }}"
          if [ -z "$CURRENT_TARGET_BRANCH" ]; then
            CURRENT_TARGET_BRANCH="${{ env.TARGET_BRANCH_DEFAULT }}"
          fi
          echo "TARGET_BRANCH_IN_FORK=$CURRENT_TARGET_BRANCH" >> $GITHUB_ENV

          if [[ "$CURRENT_UPSTREAM_REPO_URL" =~ github\.com/([^/]+/[^/]+?)(\.git)?$ ]]; then
            UPSTREAM_OWNER_REPO_VAL="${BASH_REMATCH[1]}"
          else
            echo "::warning::Could not parse UPSTREAM_OWNER_REPO from $CURRENT_UPSTREAM_REPO_URL. Using full URL as fallback."
            UPSTREAM_OWNER_REPO_VAL="$CURRENT_UPSTREAM_REPO_URL"
          fi
          echo "UPSTREAM_OWNER_REPO=$UPSTREAM_OWNER_REPO_VAL" >> $GITHUB_ENV

          echo "Defined UPSTREAM_REPO_URL: $CURRENT_UPSTREAM_REPO_URL"
          echo "Defined UPSTREAM_BRANCH_NAME: $CURRENT_UPSTREAM_BRANCH"
          echo "Defined TARGET_BRANCH_IN_FORK: $CURRENT_TARGET_BRANCH"
          echo "Parsed UPSTREAM_OWNER_REPO: $UPSTREAM_OWNER_REPO_VAL"

      - name: Add Upstream and Fetch Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_REPO_URL"
          git fetch upstream

      - name: Merge Upstream Changes
        run: |
          git checkout "$TARGET_BRANCH_IN_FORK"
          git merge "upstream/$UPSTREAM_BRANCH_NAME" --allow-unrelated-histories --no-edit || true

      - name: Push Changes
        run: |
          git push origin "$TARGET_BRANCH_IN_FORK"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Sync with upstream'
          title: 'Sync with upstream'
          body: |
            This pull request merges changes from [$UPSTREAM_OWNER_REPO](https://github.com/$UPSTREAM_OWNER_REPO) `$UPSTREAM_BRANCH_NAME` into `$TARGET_BRANCH_IN_FORK`.
          branch: "sync-${{ env.UPSTREAM_BRANCH_NAME }}-to-${{ env.TARGET_BRANCH_IN_FORK }}"
          base: ${{ env.TARGET_BRANCH_IN_FORK }}
