name: Sync Fork with Upstream and Create PR

on:
  schedule:
    # Runs daily at 00:00 UTC. You can adjust the schedule as needed.
    # See https://crontab.guru/ for cron schedule expressions.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  sync_and_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # To push the new branch to the fork
      pull-requests: write # To create the pull request in the fork

    steps:
      - name: Checkout Forked Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for all branches and tags.
          # This is crucial for correctly interacting with upstream branches.
          fetch-depth: 0
          # Optional: If GITHUB_TOKEN's default permissions are restricted,
          # you might need a Personal Access Token (PAT) with 'repo' scope.
          # token: ${{ secrets.YOUR_PAT_WITH_REPO_SCOPE }}

      - name: Set up Git User
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id}}+${{ github.actor }}@users.noreply.github.com"
      - name: Define Upstream Repository URL
        id: upstream_repo
        run: echo "url=https://github.com/nocodb/nocodb.git" >> $GITHUB_OUTPUT

      - name: Add Upstream Remote
        run: git remote add upstream ${{ steps.upstream_repo.outputs.url }}

      - name: Fetch Upstream Master
        run: |
          echo "Fetching upstream/master from ${{ steps.upstream_repo.outputs.url }}..."
          git fetch upstream master --verbose
          echo "Fetched upstream/master."
          # Verify that upstream/master ref exists and get its SHA
          UPSTREAM_HEAD_SHA=$(git rev-parse upstream/master)
          if [ -z "$UPSTREAM_HEAD_SHA" ]; then
            echo "::error::Could not resolve SHA for upstream/master after fetch. Upstream remote or branch might be incorrect."
            exit 1
          fi
          echo "SHA of fetched upstream/master is: $UPSTREAM_HEAD_SHA"
      - name: Create and Push Branch from Upstream Master
        id: sync_details # Renamed id for clarity as it provides more than just branch name
        run: |
          # Get the commit SHA of the fetched upstream/master.
          # This will be used in the PR body and for verification.
          UPSTREAM_COMMIT_SHA=$(git rev-parse upstream/master)
          echo "Target upstream commit (upstream/master): ${UPSTREAM_COMMIT_SHA}"
          
          # Make the upstream commit SHA available to subsequent steps via environment variables.
          echo "UPSTREAM_COMMIT_SHA=${UPSTREAM_COMMIT_SHA}" >> $GITHUB_ENV
          # Create a unique branch name for the PR, incorporating a timestamp.
          BRANCH_NAME="sync-upstream-$(date +%Y%m%d%H%M%S)"
          echo "Attempting to create new branch '${BRANCH_NAME}' from upstream/master..."
          # Create the new branch directly from the fetched 'upstream/master'.
          # This command checks out 'upstream/master' and creates a new branch from it in one step.
          git checkout -b "$BRANCH_NAME" upstream/master
          
          # Verify that the new branch's HEAD matches the upstream master's commit SHA.
          NEW_BRANCH_HEAD_SHA=$(git rev-parse HEAD) # HEAD now points to the new local branch
          echo "SHA of new branch ('${BRANCH_NAME}') HEAD is: ${NEW_BRANCH_HEAD_SHA}"
          if [ "${UPSTREAM_COMMIT_SHA}" != "${NEW_BRANCH_HEAD_SHA}" ]; then
            echo "::error:: Mismatch after creating branch! New branch HEAD SHA (${NEW_BRANCH_HEAD_SHA}) does not match target upstream SHA (${UPSTREAM_COMMIT_SHA})."
            exit 1 
          else
            echo "Success: New branch '${BRANCH_NAME}' correctly created from upstream/master (commit ${UPSTREAM_COMMIT_SHA})."
          fi
          
          # Push the new branch (which contains the upstream changes) to your fork (origin).
          echo "Pushing branch '${BRANCH_NAME}' to origin (your fork)..."
          git push origin "$BRANCH_NAME"
          echo "Pushed branch '${BRANCH_NAME}' to origin."
          
          # Output the new branch name for use in the pull request step.
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          # Output the upstream SHA as well, in case it's needed directly by a step output (though GITHUB_ENV is often cleaner)
          echo "upstream_sha_output=$UPSTREAM_COMMIT_SHA" >> $GITHUB_OUTPUT
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          # If you used a PAT in the checkout step, you might need to pass it here too.
          # token: ${{ secrets.YOUR_PAT_WITH_REPO_SCOPE }}
          commit-message: "chore: Sync with upstream nocodb/master"
          title: "Sync with upstream nocodb/master (Branch: ${{ steps.sync_details.outputs.branch_name }})"
          body: |
            This PR was automatically created by a GitHub Action to sync this fork's `master` branch with the latest changes from `upstream/master` (nocodb/nocodb).
            **Upstream Commit:** `${{ env.UPSTREAM_COMMIT_SHA }}`
            **Source Branch in Fork (Head of this PR):** `${{ steps.sync_details.outputs.branch_name }}`
            Please review the changes and merge if appropriate.
          branch: ${{ steps.sync_details.outputs.branch_name }} # The branch containing the upstream changes (e.g., sync-upstream-YYYYMMDDHHMMSS)
          base: master # The branch in your fork to merge into (e.g., your fork's master or main branch)
          labels: |
            upstream-sync
            automated-pr
          draft: false # Set to true if you want draft PRs
          # Optional: Assignees and Reviewers
          # assignees: your-github-username
          # reviewers: your-github-username,another-reviewer

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Sync: ${{ env.UPSTREAM_OWNER_REPO }}/${{ env.UPSTREAM_BRANCH_NAME }} (${{ env.SHORT_UPSTREAM_SHA }}) to ${{ env.TARGET_BRANCH_IN_FORK }}" \
            --body "This PR was automatically created by a GitHub Action to sync this fork with the upstream repository.
      
          **Upstream Details:**
          - Branch: \`master\`
      
          **Fork Details:**
          - Target Branch (Base): \`master\`
          - New Sync Branch (Head): \`${{ steps.sync_details.outputs.branch_name }}\`
      
          Please review the changes and merge if appropriate.
          This sync branch was created directly from the upstream commit." \
            --head "${{ steps.sync_details.outputs.branch_name }}" \
            --base "master" \
            # --label "upstream-sync" \
            --label "automated-pr"

      - name: Notify on Failure (Optional)
        if: failure()
        run: echo "::error::Workflow failed to sync with upstream and create PR."



