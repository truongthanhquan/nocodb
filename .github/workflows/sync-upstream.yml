name: Sync Fork with Upstream and Create PR

on:
  schedule:
    # Runs daily at 00:00 UTC. You can adjust as needed.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering
    inputs:
      upstream_repo_url:
        description: 'Full URL of the upstream repository (e.g., https://github.com/nocodb/nocodb.git)'
        required: true
        default: 'https://github.com/nocodb/nocodb.git'
      upstream_branch_name:
        description: 'Upstream branch to sync from (e.g., master, main, develop)'
        required: true
        default: 'master'
      target_branch_in_fork:
        description: 'Target branch in your fork to create the PR against (e.g., master, main)'
        required: true
        default: 'master'

jobs:
  sync_and_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # For creating branches/refs AND labels
      pull-requests: write # For creating pull requests

    steps:
      # ... (Checkout, Set up Git User, Define Variables, Add Upstream, Fetch Upstream, Create Branch) ...

      - name: Create Branch on Fork Remote via GitHub API
        id: create_remote_branch
        # ... (your existing step) ...
        # This step should output 'new_branch_name' and set 'NEW_BRANCH_NAME_ENV'

      # 👇 ADD THIS STEP HERE
      - name: Ensure Labels Exist in Fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Ensuring label 'upstream-sync' exists..."
          gh label create "upstream-sync" \
            --repo "${{ github.repository }}" \
            --description "Pull request to sync with upstream repository" \
            --color "1D76DB" \
            || echo "Label 'upstream-sync' already exists or failed to create (non-critical, will proceed)."

          echo "Ensuring label 'automated-pr' exists..."
          gh label create "automated-pr" \
            --repo "${{ github.repository }}" \
            --description "Pull request generated automatically by GitHub Actions" \
            --color "0E8A16" \
            || echo "Label 'automated-pr' already exists or failed to create (non-critical, will proceed)."

      - name: Create Pull Request using GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          # UPSTREAM_COMMIT_SHA from fetch_upstream step env
          # NEW_BRANCH_NAME_ENV from create_remote_branch step env
          # UPSTREAM_OWNER_REPO from vars step env
        run: |
          PR_TITLE="Sync fork: ${{ env.UPSTREAM_BRANCH_NAME }} from ${{ env.UPSTREAM_OWNER_REPO }} into ${{ env.NEW_BRANCH_NAME_ENV }}"
          PR_BODY=$(cat <<EOF
          This PR was automatically created by a GitHub Action to sync this fork.

          **Target in this Fork:** \`${{ env.TARGET_BRANCH_IN_FORK }}\`
          **Source of changes (Upstream):** \`${{ env.UPSTREAM_OWNER_REPO }}\` branch \`${{ env.UPSTREAM_BRANCH_NAME }}\`
          **Upstream Commit SHA:** \`${{ env.UPSTREAM_COMMIT_SHA }}\`
          **New branch in this Fork (Head of this PR):** \`${{ env.NEW_BRANCH_NAME_ENV }}\`

          Please review the changes and merge if appropriate.
          EOF
          )

          echo "Attempting to create PR: '${PR_TITLE}'"
          echo "Base: ${{ env.TARGET_BRANCH_IN_FORK }}"
          echo "Head: ${{ env.NEW_BRANCH_NAME_ENV }}"

          gh pr create \
            --repo "${{ github.repository }}" \
            --base "${{ env.TARGET_BRANCH_IN_FORK }}" \
            --head "${{ env.NEW_BRANCH_NAME_ENV }}" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --label "upstream-sync,automated-pr" # This should now work
            
          echo "Pull request creation process initiated for branch '${{ env.NEW_BRANCH_NAME_ENV }}' into '${{ env.TARGET_BRANCH_IN_FORK }}'."

      - name: Notify on Failure (Optional)
        if: failure()
        run: echo "::error::Workflow failed during the sync and PR creation process. Check logs for details."
