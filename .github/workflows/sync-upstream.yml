name: Sync Fork with Upstream and Create PR

on:
  schedule:
    # Runs daily at 00:00 UTC. You can adjust the schedule as needed.
    # See https://crontab.guru/ for cron schedule expressions.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  sync_and_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # To push the new branch
      pull-requests: write # To create the pull request

    steps:
      - name: Checkout Forked Repository
        uses: actions/checkout@v4
        with:
          # We need to fetch all history for all branches and tags
          # to ensure we can create a PR from the upstream branch.
          fetch-depth: 0
          # It's good practice to use a PAT with repo scope for actions
          # that push to the repository or create PRs, especially if default GITHUB_TOKEN
          # permissions are restricted.
          # token: ${{ secrets.YOUR_PAT_WITH_REPO_SCOPE }} # Optional: if GITHUB_TOKEN isn't enough

      - name: Set up Git User
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Define Upstream Repository URL
        id: upstream_repo
        run: echo "url=https://github.com/nocodb/nocodb.git" >> $GITHUB_OUTPUT

      - name: Add Upstream Remote
        run: git remote add upstream ${{ steps.upstream_repo.outputs.url }}

      - name: Fetch Upstream Master
        run: |
          git fetch upstream master
          echo "Fetched upstream/master"

      - name: Create and Push Branch from Upstream Master
        id: upstream_branch_name
        run: |
          echo "Attempting to create branch from upstream/master..."
          # Log the specific commit SHA of the fetched upstream/master
          # This ensures we know what commit 'upstream/master' was pointing to after the fetch.
          UPSTREAM_MASTER_SHA=$(git rev-parse refs/remotes/upstream/master)
          echo "SHA of refs/remotes/upstream/master (nocodb/nocodb/master) is: ${UPSTREAM_MASTER_SHA}"

          # Create a unique branch name for the PR to avoid conflicts if a PR already exists
          BRANCH_NAME="sync-upstream-$(date +%Y%m%d%H%M%S)"
          
          # Create the new branch explicitly from the remote-tracking branch 'refs/remotes/upstream/master'.
          # This is more specific than just 'upstream/master' and avoids potential ambiguity.
          git checkout -b "$BRANCH_NAME" "refs/remotes/upstream/master"
          
          # Verify the new branch's commit SHA
          NEW_BRANCH_SHA=$(git rev-parse HEAD) # HEAD now points to the new branch
          echo "SHA of new branch (${BRANCH_NAME}) HEAD is: ${NEW_BRANCH_SHA}"

          if [ "${UPSTREAM_MASTER_SHA}" != "${NEW_BRANCH_SHA}" ]; then
            echo "::error:: Mismatch! New branch HEAD SHA (${NEW_BRANCH_SHA}) does not match refs/remotes/upstream/master SHA (${UPSTREAM_MASTER_SHA})."
            echo "This indicates the new branch was not correctly created from the intended upstream commit."
            # You could optionally cause the workflow to fail here if this check fails:
            # exit 1 
          else
            echo "Success: New branch ${BRANCH_NAME} correctly created from refs/remotes/upstream/master."
          fi
          
          # Push the new branch (containing upstream changes) to your fork (origin)
          git push origin "$BRANCH_NAME"
          echo "Pushed branch $BRANCH_NAME to origin."
          
          # Output the branch name for use in the next step
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Created and pushed branch $BRANCH_NAME from upstream/master"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          # If you used a PAT in the checkout step, you might need to pass it here too.
          # token: ${{ secrets.YOUR_PAT_WITH_REPO_SCOPE }}
          commit-message: "chore: Sync with upstream nocodb/master"
          title: "Sync with upstream nocodb/master (${{ steps.upstream_branch_name.outputs.name }})"
          body: |
            This PR was automatically created by a GitHub Action to sync this fork's `master` branch with the latest changes from `upstream/master` (nocodb/nocodb).

            **Upstream Commit Ref:** `refs/remotes/upstream/master`
            **Source Branch in Fork (Head of PR):** `${{ steps.upstream_branch_name.outputs.name }}`

            Please review the changes and merge if appropriate.
          branch: ${{ steps.upstream_branch_name.outputs.name }} # The branch containing the upstream changes
          base: master # The branch to merge into in your fork (your fork's master branch)
          labels: |
            upstream-sync
            automated-pr
          draft: false # Set to true if you want draft PRs
          # Optional: Assignees and Reviewers
          # assignees: your-github-username
          # reviewers: your-github-username,another-reviewer

      - name: Notify on Failure (Optional)
        if: failure()
        run: echo "::error::Failed to sync with upstream and create PR."

